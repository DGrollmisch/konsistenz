// ---------- Date Helpers ----------
// Lokales Datum als YYYY-MM-DD (NICHT UTC, sonst Tagesverschiebung)
const dateKey = (d = new Date()) => {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};
const todayKey = () => dateKey(new Date());
// Datum-Strings als lokale Zeit interpretieren (T12:00 vermeidet Zeitzonen-Kippen)
const parseKey = (key) => new Date(key + 'T12:00:00');
const formatDateDE = (key) => parseKey(key).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const formatDateShort = (key) => parseKey(key).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });

const getWeekStart = (date = new Date()) => {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return dateKey(d);
};

const getDaysUntilAugust = () => {
  const today = new Date();
  const aug = new Date(today.getFullYear(), 7, 1);
  if (aug < today) aug.setFullYear(aug.getFullYear() + 1);
  return Math.ceil((aug - today) / (1000 * 60 * 60 * 24));
};

const formatDuration = (seconds) => {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
};

const formatPace = (secondsPerKm) => {
  if (!isFinite(secondsPerKm) || secondsPerKm <= 0) return '-';
  const m = Math.floor(secondsPerKm / 60);
  const s = Math.floor(secondsPerKm % 60);
  return `${m}:${String(s).padStart(2, '0')}/km`;
};

// Push-up Set Helpers
const sumReps = (sets) => (sets || []).reduce((a, s) => a + (typeof s === 'number' ? s : (s?.reps || 0)), 0);
const formatTime = (ts) => {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
};

// ---------- Streak ----------
const calculateStreak = (workouts, runs, pushupDays, manualActivities = []) => {
  const activeDays = new Set();
  workouts.filter(w => w.done).forEach(w => activeDays.add(w.date));
  runs.forEach(r => activeDays.add(r.date));
  (manualActivities || []).forEach(a => activeDays.add(a.date));
  Object.entries(pushupDays).forEach(([date, day]) => {
    const total = sumReps(day.sets);
    if (total >= 100 || day.done) activeDays.add(date);
  });

  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = dateKey(d);
    if (activeDays.has(key)) streak++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return streak;
};

// Aktivitäts-Statistik der laufenden Woche für lazy/aktiv-Bewertung
const getWeekActivityCount = (state, weekStartKey) => {
  const days = new Set();
  const weekStart = parseKey(weekStartKey);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 7);
  const inWeek = (dateStr) => {
    const d = parseKey(dateStr);
    return d >= weekStart && d < weekEnd;
  };
  state.workouts.filter(w => w.done && inWeek(w.date)).forEach(w => days.add(w.date));
  state.runs.filter(r => inWeek(r.date)).forEach(r => days.add(r.date));
  (state.manualActivities || []).filter(a => inWeek(a.date)).forEach(a => days.add(a.date));
  Object.entries(state.pushupDays).forEach(([date, day]) => {
    if (inWeek(date) && (sumReps(day.sets) >= 100 || day.done)) days.add(date);
  });
  return days.size;
};

// Baut den Kontext für die nächste Story-Fortsetzung (hierarchisch, nicht der ganze Log)
const buildStoryContext = (story, state) => {
  const today = todayKey();
  const weekStart = getWeekStart();
  const parts = [];

  if (story.meta.genre) {
    parts.push(`GENRE/SETTING: ${story.meta.genre}`);
  }
  if (story.meta.character) {
    parts.push(`HAUPTCHARAKTER (der Spieler): ${story.meta.character}`);
  }
  if (story.meta.arc) {
    parts.push(`AKTUELLER SPANNUNGSBOGEN: ${story.meta.arc}`);
  }

  // Monatszusammenfassungen (älteste Ebene)
  const monthKeys = Object.keys(story.summaries.monthly).sort();
  if (monthKeys.length > 0) {
    parts.push('FRÜHERE MONATE:\n' + monthKeys.map(k => `- ${k}: ${story.summaries.monthly[k]}`).join('\n'));
  }

  // Wochenzusammenfassungen (mittlere Ebene), aktuelle Woche ausgenommen
  const weekKeys = Object.keys(story.summaries.weekly).filter(k => k !== weekStart).sort();
  if (weekKeys.length > 0) {
    parts.push('FRÜHERE WOCHEN:\n' + weekKeys.map(k => `- Woche ab ${formatDateShort(k)}: ${story.summaries.weekly[k]}`).join('\n'));
  }

  // Tageszusammenfassungen dieser Woche (feinste Ebene unterhalb heute), heute ausgenommen
  const dayKeys = Object.keys(story.summaries.daily).filter(k => k !== today && parseKey(k) >= parseKey(weekStart)).sort();
  if (dayKeys.length > 0) {
    parts.push('DIESE WOCHE BISHER:\n' + dayKeys.map(k => `- ${formatDateShort(k)}: ${story.summaries.daily[k]}`).join('\n'));
  }

  // Heutige Beats im Volltext
  const todayBeats = story.beats.filter(b => b.date === today);
  if (todayBeats.length > 0) {
    parts.push('HEUTE BISHER:\n' + todayBeats.map(b => b.text).join('\n\n'));
  }

  // Aktivitätslage für lazy/aktiv
  const weekCount = getWeekActivityCount(state, weekStart);
  let activityNote;
  if (weekCount === 0) parts.push('AKTIVITÄTSLAGE: Diese Woche noch keine aktiven Tage. Der Held ist untätig, die Bedrohung wächst.');
  else if (weekCount < 3) parts.push(`AKTIVITÄTSLAGE: ${weekCount} von 3 angestrebten aktiven Tagen diese Woche. Unter dem Schnitt. Der Held kämpft gegen Schwäche, die Welt wird dunkler.`);
  else if (weekCount === 3) parts.push(`AKTIVITÄTSLAGE: 3 aktive Tage diese Woche, genau der Schnitt. Der Held hält sein Niveau.`);
  else parts.push(`AKTIVITÄTSLAGE: ${weekCount} aktive Tage diese Woche, über dem Schnitt. Der Held ist im Aufschwung, gewinnt an Kraft.`);

  return parts.join('\n\n');
};

const STORY_SYSTEM_PROMPT = `Du bist der Erzähler eines fortlaufenden Fantasy-Abenteuers im Stil eines Pen-and-Paper-Rollenspiels. Der Spieler ist der Hauptcharakter. Seine echten sportlichen Aktivitäten (Liegestütze, Läufe, andere Übungen) treiben die Geschichte voran: jede Aktivität ist ein konkreter Fortschritt im aktuellen Kampf oder Hindernis.

Regeln:
- Schreibe auf Deutsch, in der zweiten Person ("du").
- Jede Fortsetzung ist KURZ: 2 bis 4 Sätze. Niemals länger.
- Knüpfe nahtlos an das bisher Geschehene an.
- Eine sportliche Aktivität = ein erzählerischer Fortschritt. Mehr Wiederholungen oder Kilometer = größerer Fortschritt.
- Wenn der Spieler aktiv ist (über dem Schnitt), gewinnt der Held an Stärke, die Lage bessert sich.
- Wenn der Spieler untätig ist (unter dem Schnitt), wird die Bedrohung größer, der Held schwächelt. Bestrafe erzählerisch, nicht moralisierend. Niemals den Spieler beschimpfen.
- Halte einen Spannungsbogen: es gibt immer eine Herausforderung zu überwinden, einen Gegner, ein Ziel.
- Sei nüchtern-episch, nicht kitschig. Kein Influencer-Ton.
- Antworte NUR mit dem Erzähltext, keine Vorrede, keine Erklärung, keine Anführungszeichen.`;

const callClaude = async (apiKey, systemPrompt, userMessage, maxTokens = 400) => {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API ${response.status}: ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  return data.content.filter(c => c.type === 'text').map(c => c.text).join('').trim();
};

// Erzeugt eine neue Story-Fortsetzung und aktualisiert den Story-State
const generateBeat = async (apiKey, story, state, trigger, triggerDetail) => {
  const context = buildStoryContext(story, state);
  let instruction;
  if (trigger === 'open') {
    instruction = story.beats.length === 0
      ? 'Beginne ein neues Abenteuer. Wähle ein überraschendes Fantasy-Setting und einen Helden. Gib in der ERSTEN Zeile exakt dieses Format aus: [SETTING: kurze Beschreibung des Settings] [HELD: kurze Beschreibung des Helden]. Danach in einer neuen Zeile die erste Szene mit einer Herausforderung, 2 bis 4 Sätze.'
      : 'Ein neuer Tag bricht an. Eröffne die heutige Szene und erinnere kurz an die offene Herausforderung. 2 bis 4 Sätze.';
  } else if (trigger === 'pushups') {
    instruction = `Der Held hat gerade einen Satz Liegestütze geschafft (${triggerDetail}). Treibe den aktuellen Kampf/das Hindernis ein Stück voran. 2 bis 4 Sätze.`;
  } else if (trigger === 'run') {
    instruction = `Der Held ist gelaufen (${triggerDetail}). Das bedeutet einen größeren Vorstoß in der Geschichte, eine zurückgelegte Distanz im Abenteuer. 2 bis 4 Sätze.`;
  } else if (trigger === 'manual') {
    instruction = `Der Held hat eine Übung absolviert (${triggerDetail}). Treibe die Geschichte ein Stück voran. 2 bis 4 Sätze.`;
  } else {
    instruction = 'Setze die Geschichte ein Stück fort. 2 bis 4 Sätze.';
  }

  const userMessage = `${context}\n\n---\nAUFGABE: ${instruction}`;
  const text = await callClaude(apiKey, STORY_SYSTEM_PROMPT, userMessage, 400);

  // Beim allerersten Beat Setting und Held extrahieren
  if (trigger === 'open' && story.beats.length === 0) {
    const settingMatch = text.match(/\[SETTING:\s*([^\]]+)\]/i);
    const heldMatch = text.match(/\[HELD:\s*([^\]]+)\]/i);
    const cleanText = text.replace(/\[SETTING:[^\]]*\]/i, '').replace(/\[HELD:[^\]]*\]/i, '').trim();
    return {
      text: cleanText,
      genre: settingMatch ? settingMatch[1].trim() : null,
      character: heldMatch ? heldMatch[1].trim() : null,
    };
  }

  return { text, genre: null, character: null };
};

// ---------- Geo Helpers ----------
const haversine = (lat1, lon1, lat2, lon2) => {
  const R = 6371000;
  const toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
};

// ---------- Mini Route Map (SVG) ----------
const RouteMap = ({ points, className = '' }) => {
  if (!points || points.length < 2) {
    return <div className={`bg-neutral-800 rounded-xl flex items-center justify-center text-neutral-500 text-sm ${className}`}>Keine Route</div>;
  }
  const lats = points.map(p => p.lat);
  const lons = points.map(p => p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const padLat = (maxLat - minLat) * 0.1 || 0.001;
  const padLon = (maxLon - minLon) * 0.1 || 0.001;
  const w = 400, h = 200;
  const project = (lat, lon) => {
    const x = ((lon - (minLon - padLon)) / ((maxLon + padLon) - (minLon - padLon))) * w;
    const y = h - ((lat - (minLat - padLat)) / ((maxLat + padLat) - (minLat - padLat))) * h;
    return [x, y];
  };
  const d = points.map((p, i) => {
    const [x, y] = project(p.lat, p.lon);
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const [sx, sy] = project(points[0].lat, points[0].lon);
  const [ex, ey] = project(points[points.length - 1].lat, points[points.length - 1].lon);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className={`bg-neutral-800 rounded-xl ${className}`} preserveAspectRatio="xMidYMid meet">
      <path d={d} stroke="#a3e635" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={sx} cy={sy} r="5" fill="#84cc16" />
      <circle cx={ex} cy={ey} r="5" fill="#ef4444" />
    </svg>
  );
};

// ---------- Run Tracker ----------
const RunTracker = ({ state, setState, onBack, onRunSaved }) => {
  const [status, setStatus] = useState('idle'); // idle | active | paused | finished
  const [points, setPoints] = useState([]);
  const [distance, setDistance] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [maxSpeed, setMaxSpeed] = useState(0);
  const [error, setError] = useState(null);
  const watchIdRef = useRef(null);
  const timerRef = useRef(null);
  const startTimeRef = useRef(null);
  const pausedAtRef = useRef(0);
  const wakeLockRef = useRef(null);

  const requestWakeLock = async () => {
    try {
      if ('wakeLock' in navigator) {
        wakeLockRef.current = await navigator.wakeLock.request('screen');
      }
    } catch (e) {
      console.warn('Wake Lock fehlgeschlagen', e);
    }
  };

  const releaseWakeLock = async () => {
    try { await wakeLockRef.current?.release(); } catch (e) {}
    wakeLockRef.current = null;
  };

  const start = () => {
    if (!navigator.geolocation) {
      setError('GPS nicht verfügbar.');
      return;
    }
    setStatus('active');
    startTimeRef.current = Date.now();
    pausedAtRef.current = 0;
    setPoints([]);
    setDistance(0);
    setElapsed(0);
    setMaxSpeed(0);
    requestWakeLock();

    timerRef.current = setInterval(() => {
      setElapsed((Date.now() - startTimeRef.current - pausedAtRef.current) / 1000);
    }, 500);

    watchIdRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, speed, accuracy } = pos.coords;
        if (accuracy > 30) return; // schlechte Punkte verwerfen
        const newPoint = { lat: latitude, lon: longitude, t: Date.now() };
        setPoints((prev) => {
          const next = [...prev, newPoint];
          if (prev.length > 0) {
            const last = prev[prev.length - 1];
            const d = haversine(last.lat, last.lon, latitude, longitude);
            if (d > 1 && d < 100) {
              setDistance((curr) => curr + d);
            }
          }
          return next;
        });
        if (speed && speed > maxSpeed) setMaxSpeed(speed);
      },
      (err) => setError(`GPS Fehler: ${err.message}`),
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  };

  const pause = () => {
    setStatus('paused');
    clearInterval(timerRef.current);
    if (watchIdRef.current !== null) navigator.geolocation.clearWatch(watchIdRef.current);
    pausedAtRef.current = pausedAtRef.current + (Date.now() - startTimeRef.current - pausedAtRef.current - elapsed * 1000);
  };

  const resume = () => {
    setStatus('active');
    const pauseStart = Date.now();
    startTimeRef.current = Date.now() - elapsed * 1000;
    timerRef.current = setInterval(() => {
      setElapsed((Date.now() - startTimeRef.current) / 1000);
    }, 500);
    watchIdRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, speed, accuracy } = pos.coords;
        if (accuracy > 30) return;
        setPoints((prev) => {
          const next = [...prev, { lat: latitude, lon: longitude, t: Date.now() }];
          if (prev.length > 0) {
            const last = prev[prev.length - 1];
            const d = haversine(last.lat, last.lon, latitude, longitude);
            if (d > 1 && d < 100) setDistance((curr) => curr + d);
          }
          return next;
        });
        if (speed && speed > maxSpeed) setMaxSpeed(speed);
      },
      (err) => setError(`GPS Fehler: ${err.message}`),
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  };

  const stop = () => {
    clearInterval(timerRef.current);
    if (watchIdRef.current !== null) navigator.geolocation.clearWatch(watchIdRef.current);
    releaseWakeLock();
    setStatus('finished');
  };

  const save = () => {
    const run = {
      id: `r_${Date.now()}`,
      date: todayKey(),
      startedAt: startTimeRef.current,
      distance,
      duration: elapsed,
      points,
      maxSpeed,
      note: '',
    };
    setState({ ...state, runs: [...state.runs, run] });
    if (onRunSaved) onRunSaved(run);
    onBack();
  };

  const discard = () => {
    if (window.confirm('Lauf verwerfen?')) onBack();
  };

  useEffect(() => {
    return () => {
      clearInterval(timerRef.current);
      if (watchIdRef.current !== null) navigator.geolocation.clearWatch(watchIdRef.current);
      releaseWakeLock();
    };
  }, []);

  const km = distance / 1000;
  const pace = km > 0 ? elapsed / km : 0;
  const maxKmh = maxSpeed * 3.6;

  return (
    <div className="pb-24">
      <div className="sticky top-0 bg-neutral-950 z-10 pt-6 pb-3 -mx-4 px-4 border-b border-neutral-900">
        <div className="flex items-center gap-3">
          <button onClick={status === 'idle' ? onBack : () => window.confirm('Lauf abbrechen?') && onBack()} className="text-neutral-400">
            <ChevronLeft size={24} />
          </button>
          <h1 className="text-xl font-bold text-neutral-100">Laufen</h1>
          {status === 'active' && <span className="ml-auto flex items-center gap-1.5 text-xs text-lime-400"><span className="w-2 h-2 bg-lime-400 rounded-full animate-pulse" /> live</span>}
        </div>
      </div>

      {error && <Card className="mt-4 border-red-900"><p className="text-red-400 text-sm">{error}</p></Card>}

      <div className="pt-6 space-y-4">
        <Card>
          <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Distanz</p>
          <p className="text-5xl font-bold text-neutral-100 tabular-nums">{km.toFixed(2)}<span className="text-neutral-600 text-2xl"> km</span></p>
        </Card>

        <div className="grid grid-cols-3 gap-3">
          <Card>
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Zeit</p>
            <p className="text-xl font-bold text-neutral-100 tabular-nums">{formatDuration(elapsed)}</p>
          </Card>
          <Card>
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Pace</p>
            <p className="text-xl font-bold text-neutral-100 tabular-nums">{formatPace(pace)}</p>
          </Card>
          <Card>
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Max</p>
            <p className="text-xl font-bold text-neutral-100 tabular-nums">{maxKmh.toFixed(1)}<span className="text-neutral-600 text-sm"> km/h</span></p>
          </Card>
        </div>

        {points.length > 1 && (
          <Card>
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Route</p>
            <RouteMap points={points} className="w-full h-48" />
            <p className="text-xs text-neutral-600 mt-2">{points.length} Punkte</p>
          </Card>
        )}

        <div className="fixed bottom-20 left-0 right-0 px-4">
          <div className="max-w-md mx-auto flex gap-2">
            {status === 'idle' && (
              <Button onClick={start} variant="primary" className="w-full shadow-2xl shadow-lime-400/20">
                <span className="flex items-center justify-center gap-2"><Play size={20} /> Start</span>
              </Button>
            )}
            {status === 'active' && (
              <>
                <Button onClick={pause} variant="secondary" className="flex-1">
                  <span className="flex items-center justify-center gap-2"><Pause size={20} /> Pause</span>
                </Button>
                <Button onClick={stop} variant="danger" className="flex-1">
                  <span className="flex items-center justify-center gap-2"><SquareIcon size={18} /> Stopp</span>
                </Button>
              </>
            )}
            {status === 'paused' && (
              <>
                <Button onClick={resume} variant="primary" className="flex-1">
                  <span className="flex items-center justify-center gap-2"><Play size={20} /> Weiter</span>
                </Button>
                <Button onClick={stop} variant="danger" className="flex-1">
                  <span className="flex items-center justify-center gap-2"><SquareIcon size={18} /> Stopp</span>
                </Button>
              </>
            )}
            {status === 'finished' && (
              <>
                <Button onClick={discard} variant="secondary" className="flex-1">Verwerfen</Button>
                <Button onClick={save} variant="primary" className="flex-1">Speichern</Button>
              </>
            )}
          </div>
        </div>

        {status === 'idle' && (
          <p className="text-center text-neutral-600 text-sm px-4 pt-6">
            Beim Lauf bleibt der Bildschirm an. Lade dein Handy vorher.
          </p>
        )}
      </div>
    </div>
  );
};

// ---------- Workout Session ----------
const WorkoutSession = ({ state, setState, templateId, onBack, onExportWorkout }) => {
  const template = state.templates.find(t => t.id === templateId);
  const today = todayKey();
  const existing = state.workouts.find(w => w.date === today && w.templateId === templateId);

  const [logs, setLogs] = useState(() => {
    if (existing) return existing.exercises;
    return template.exercises.map(ex => ({
      exerciseId: ex.id,
      name: ex.name,
      sets: Array.from({ length: ex.defaultSets }, () => ({
        reps: typeof ex.defaultReps === 'number' ? ex.defaultReps : '',
        weight: ex.usesWeight ? '' : null,
        rpe: 7,
      })),
      note: '',
    }));
  });
  const [startTime] = useState(existing?.startedAt || Date.now());
  const [levelUps, setLevelUps] = useState([]);
  const [savedWorkout, setSavedWorkout] = useState(null);

  const updateSet = (exIdx, setIdx, field, value) => {
    const next = [...logs];
    next[exIdx].sets[setIdx][field] = value;
    setLogs(next);
  };

  const addSet = (exIdx) => {
    const next = [...logs];
    const last = next[exIdx].sets[next[exIdx].sets.length - 1] || { reps: '', weight: '', rpe: 7 };
    next[exIdx].sets.push({ ...last });
    setLogs(next);
  };

  const removeSet = (exIdx, setIdx) => {
    const next = [...logs];
    next[exIdx].sets.splice(setIdx, 1);
    setLogs(next);
  };

  const updateNote = (exIdx, note) => {
    const next = [...logs];
    next[exIdx].note = note;
    setLogs(next);
  };

  const checkLevelUps = (workoutLogs) => {
    const records = { ...(state.personalRecords || {}) };
    const ups = [];
    workoutLogs.forEach(log => {
      const numericSets = log.sets.filter(s => typeof s.reps === 'number' || (typeof s.reps === 'string' && /^\d+$/.test(s.reps)));
      if (numericSets.length === 0) return;
      const maxReps = Math.max(...numericSets.map(s => parseInt(s.reps, 10) || 0));
      const maxWeight = log.sets.reduce((max, s) => {
        const w = parseFloat(s.weight) || 0;
        return w > max ? w : max;
      }, 0);
      const prev = records[log.exerciseId] || { maxReps: 0, maxWeight: 0 };
      if (maxReps > prev.maxReps && maxReps > 0) {
        ups.push(`${log.name}: ${maxReps} Wdh.`);
        prev.maxReps = maxReps;
      }
      if (maxWeight > prev.maxWeight && maxWeight > 0) {
        ups.push(`${log.name}: ${maxWeight} kg`);
        prev.maxWeight = maxWeight;
      }
      records[log.exerciseId] = prev;
    });
    return { records, ups };
  };

  const finish = () => {
    const { records, ups } = checkLevelUps(logs);
    const workout = {
      id: existing?.id || `w_${Date.now()}`,
      date: today,
      templateId,
      startedAt: startTime,
      duration: (Date.now() - startTime) / 1000,
      exercises: logs,
      done: true,
      note: existing?.note || '',
    };
    const workouts = existing
      ? state.workouts.map(w => w.id === existing.id ? workout : w)
      : [...state.workouts, workout];
    setState({ ...state, workouts, personalRecords: records });
    setSavedWorkout(workout);
    if (ups.length > 0) setLevelUps(ups);
  };

  if (savedWorkout && levelUps.length === 0) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <Check size={48} className="text-lime-400 mb-4" />
        <h1 className="text-3xl font-bold text-neutral-100 mb-2">Erledigt</h1>
        <p className="text-neutral-400 mb-8">{template.name} · {formatDuration(savedWorkout.duration)}</p>
        <div className="space-y-2 w-full max-w-sm">
          <Button onClick={() => onExportWorkout(savedWorkout)} variant="orange" className="w-full">
            <span className="flex items-center justify-center gap-2"><Share2 size={18} /> Bei Strava posten</span>
          </Button>
          <Button onClick={onBack} variant="secondary" className="w-full">Fertig</Button>
        </div>
      </div>
    );
  }

  if (levelUps.length > 0) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <TrendingUp size={48} className="text-lime-400 mb-4" />
        <h1 className="text-3xl font-bold text-neutral-100 mb-2">Level Up</h1>
        <p className="text-neutral-400 mb-6">Neue persönliche Bestleistung.</p>
        <div className="space-y-2 mb-8 w-full max-w-sm">
          {levelUps.map((u, i) => (
            <div key={i} className="bg-lime-400/10 border border-lime-400/30 rounded-xl p-3 text-lime-300 text-sm">{u}</div>
          ))}
        </div>
        <div className="space-y-2 w-full max-w-sm">
          <Button onClick={() => onExportWorkout(savedWorkout)} variant="orange" className="w-full">
            <span className="flex items-center justify-center gap-2"><Share2 size={18} /> Bei Strava posten</span>
          </Button>
          <Button onClick={onBack} variant="secondary" className="w-full">Weiter</Button>
        </div>
      </div>
    );
  }

  return (
    <div className="pb-32">
      <div className="sticky top-0 bg-neutral-950 z-10 pt-6 pb-3 -mx-4 px-4 border-b border-neutral-900">
        <div className="flex items-center gap-3 mb-2">
          <button onClick={onBack} className="text-neutral-400 active:scale-95"><ChevronLeft size={24} /></button>
          <div>
            <p className="text-xs text-neutral-500 uppercase tracking-wider">Tag {template.day}</p>
            <h1 className="text-xl font-bold text-neutral-100">{template.name}</h1>
          </div>
        </div>
      </div>

      <div className="space-y-4 pt-4">
        {logs.map((log, exIdx) => {
          const ex = template.exercises[exIdx];
          return (
            <Card key={exIdx}>
              <div className="flex justify-between items-start mb-3">
                <div>
                  <h3 className="font-semibold text-neutral-100">{log.name}</h3>
                  {ex?.note && <p className="text-xs text-neutral-500 mt-0.5">{ex.note}</p>}
                </div>
              </div>

              <div className="space-y-2 mb-3">
                <div className="grid grid-cols-12 gap-2 text-xs text-neutral-500 px-1">
                  <span className="col-span-1">#</span>
                  <span className="col-span-3">Wdh.</span>
                  {ex?.usesWeight && <span className="col-span-3">kg</span>}
                  <span className={ex?.usesWeight ? 'col-span-3' : 'col-span-6'}>RPE</span>
                  <span className="col-span-2"></span>
                </div>
                {log.sets.map((s, sIdx) => (
                  <div key={sIdx} className="grid grid-cols-12 gap-2 items-center">
                    <span className="col-span-1 text-neutral-500 text-sm">{sIdx + 1}</span>
                    <input
                      type="text" inputMode="numeric" value={s.reps}
                      onChange={(e) => updateSet(exIdx, sIdx, 'reps', e.target.value)}
                      className="col-span-3 bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-neutral-100 text-sm"
                    />
                    {ex?.usesWeight && (
                      <input
                        type="text" inputMode="decimal" value={s.weight}
                        onChange={(e) => updateSet(exIdx, sIdx, 'weight', e.target.value)}
                        className="col-span-3 bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-neutral-100 text-sm"
                      />
                    )}
                    <input
                      type="number" min="1" max="10" value={s.rpe}
                      onChange={(e) => updateSet(exIdx, sIdx, 'rpe', Number(e.target.value))}
                      className={`${ex?.usesWeight ? 'col-span-3' : 'col-span-6'} bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-neutral-100 text-sm`}
                    />
                    <button onClick={() => removeSet(exIdx, sIdx)} className="col-span-2 text-neutral-600 hover:text-red-400 flex justify-end pr-2">
                      <Trash2 size={16} />
                    </button>
                  </div>
                ))}
              </div>

              <button onClick={() => addSet(exIdx)} className="text-sm text-lime-400 hover:text-lime-300 flex items-center gap-1">
                <Plus size={14} /> Set hinzufügen
              </button>

              <textarea
                value={log.note}
                onChange={(e) => updateNote(exIdx, e.target.value)}
                placeholder="Notiz (optional)"
                className="mt-3 w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-neutral-100 text-sm resize-none"
                rows="2"
              />
            </Card>
          );
        })}
      </div>

      <div className="fixed bottom-20 left-0 right-0 px-4 z-20">
        <div className="max-w-md mx-auto">
          <Button onClick={finish} variant="primary" className="w-full shadow-2xl shadow-lime-400/20">
            Workout abschließen
          </Button>
        </div>
      </div>
    </div>
  );
};

// ---------- Plan ----------
const Plan = ({ state, setState }) => {
  const [editingId, setEditingId] = useState(null);
  const template = state.templates.find(t => t.id === editingId);
  const [draft, setDraft] = useState(null);

  useEffect(() => {
    if (template) setDraft(JSON.parse(JSON.stringify(template)));
    else setDraft(null);
  }, [editingId]);

  const saveDraft = () => {
    setState({ ...state, templates: state.templates.map(t => t.id === draft.id ? draft : t) });
    setEditingId(null);
  };

  const updateExercise = (idx, field, value) => {
    const next = { ...draft, exercises: [...draft.exercises] };
    next.exercises[idx] = { ...next.exercises[idx], [field]: value };
    setDraft(next);
  };

  const removeExercise = (idx) => setDraft({ ...draft, exercises: draft.exercises.filter((_, i) => i !== idx) });
  const addExercise = () => setDraft({
    ...draft,
    exercises: [...draft.exercises, { id: `ex_${Date.now()}`, name: 'Neue Übung', defaultSets: 3, defaultReps: 10, usesWeight: false, note: '' }],
  });

  if (draft && draft.type !== 'run') {
    return (
      <div className="pb-24">
        <div className="flex items-center gap-3 pt-6 pb-4">
          <button onClick={() => setEditingId(null)} className="text-neutral-400"><ChevronLeft size={24} /></button>
          <h1 className="text-2xl font-bold text-neutral-100">Plan bearbeiten</h1>
        </div>

        <Card className="mb-4">
          <label className="text-xs text-neutral-500 uppercase">Name</label>
          <Input value={draft.name} onChange={(v) => setDraft({ ...draft, name: v })} />
        </Card>

        <div className="space-y-3">
          {draft.exercises.map((ex, idx) => (
            <Card key={ex.id}>

                  <Trash2 size={18} />
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <div>
                  <label className="text-xs text-neutral-500">Sets</label>
                  <Input value={ex.defaultSets} onChange={(v) => updateExercise(idx, 'defaultSets', Number(v) || 1)} type="number" inputMode="numeric" />
                </div>
                <div>
                  <label className="text-xs text-neutral-500">Wdh.</label>
                  <Input value={ex.defaultReps} onChange={(v) => updateExercise(idx, 'defaultReps', v)} />
                </div>
              </div>
              <label className="flex items-center gap-2 text-sm text-neutral-400 py-2">
                <input type="checkbox" checked={ex.usesWeight} onChange={(e) => updateExercise(idx, 'usesWeight', e.target.checked)} className="accent-lime-400 w-4 h-4" />

              </label>
              <Input value={ex.note} onChange={(v) => updateExercise(idx, 'note', v)} placeholder="Notiz" className="text-sm" />
            </Card>
          ))}
        </div>

        <Button onClick={addExercise} variant="secondary" className="w-full mt-3">
          <span className="flex items-center justify-center gap-2"><Plus size={18} /> Übung hinzufügen</span>
        </Button>

        <div className="fixed bottom-20 left-0 right-0 px-4 z-20">
          <div className="max-w-md mx-auto flex gap-2">
            <Button onClick={() => setEditingId(null)} variant="secondary" className="flex-1">Abbrechen</Button>

    );
  }

  return (
    <div className="pb-24">

        <p className="text-sm text-neutral-500 mt-1">4 Tage Kraft + Laufen flexibel</p>

// ---------- Stats (Week/Month/Year) ----------
const Stats = ({ state, onShowProgression, onShowRun }) => {
  const [view, setView] = useState('week');

  const allActiveDays = useMemo(() => {
    const set = new Set();
    state.workouts.filter(w => w.done).forEach(w => set.add(w.date));
    state.runs.forEach(r => set.add(r.date));
    (state.manualActivities || []).forEach(a => set.add(a.date));
    Object.entries(state.pushupDays).forEach(([date, day]) => {
      const total = sumReps(day.sets);
      if (total >= 100 || day.done) set.add(date);
    });
    return set;
  }, [state]);

  const streak = useMemo(() => calculateStreak(state.workouts, state.runs, state.pushupDays, state.manualActivities), [state]);

  // Week view
  const weekData = useMemo(() => {
    if (view !== 'week') return null;
    const weekStart = getWeekStart();
    const days = [];
    const d = new Date(weekStart);
    for (let i = 0; i < 7; i++) {
      const key = dateKey(d);
      const pushups = state.pushupDays[key];
      const total = pushups ? sumReps(pushups.sets) : 0;
      const workouts = state.workouts.filter(w => w.date === key && w.done);
      const runs = state.runs.filter(r => r.date === key);
      days.push({
        key,
        label: d.toLocaleDateString('de-DE', { weekday: 'short' }),
        date: d.getDate(),
        pushups: total,
        workouts: workouts.length,
        runs: runs.length,
        runKm: runs.reduce((a, r) => a + r.distance / 1000, 0),
        active: allActiveDays.has(key),
        isToday: key === todayKey(),
      });
      d.setDate(d.getDate() + 1);
    }
    return {
      days,
      weekStart,
      trainingDays: days.filter(d => d.active).length,
      weekPushups: days.reduce((a, d) => a + d.pushups, 0),
      workouts: days.reduce((a, d) => a + d.workouts, 0),
      runKm: days.reduce((a, d) => a + d.runKm, 0),
    };
  }, [view, state, allActiveDays]);

  // Month view
  const monthData = useMemo(() => {
    if (view !== 'month') return null;
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const offset = (first.getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let d = 1; d <= last.getDate(); d++) {
      const date = new Date(year, month, d);
      const key = dateKey(date);
      const pushups = state.pushupDays[key];
      const total = pushups ? sumReps(pushups.sets) : 0;
      const workouts = state.workouts.filter(w => w.date === key && w.done).length;
      const runs = state.runs.filter(r => r.date === key);
      let intensity = 0;
      if (workouts > 0 || runs.length > 0) intensity = 3;
      else if (total >= 100 || pushups?.done) intensity = 2;
      else if (total > 0) intensity = 1;
      cells.push({ day: d, key, intensity, isToday: key === todayKey(), total, workouts, runs: runs.length });
    }
    const monthRuns = state.runs.filter(r => r.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`));
    const monthWorkouts = state.workouts.filter(w => w.done && w.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`));
    const monthPushups = Object.entries(state.pushupDays)
      .filter(([k]) => k.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`))
      .reduce((a, [, day]) => a + sumReps(day.sets), 0);
    return {
      cells,
      monthLabel: now.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }),
      runs: monthRuns.length,
      runKm: monthRuns.reduce((a, r) => a + r.distance / 1000, 0),
      workouts: monthWorkouts.length,
      pushups: monthPushups,
      activeDays: cells.filter(c => c && c.intensity > 0).length,
    };
  }, [view, state]);

  // Year view
  const yearData = useMemo(() => {
    if (view !== 'year') return null;
    const year = new Date().getFullYear();
    const months = [];
    for (let m = 0; m < 12; m++) {
      const prefix = `${year}-${String(m + 1).padStart(2, '0')}`;
      const runs = state.runs.filter(r => r.date.startsWith(prefix));
      const workouts = state.workouts.filter(w => w.done && w.date.startsWith(prefix));
      const pushups = Object.entries(state.pushupDays)
        .filter(([k]) => k.startsWith(prefix))
        .reduce((a, [, day]) => a + sumReps(day.sets), 0);
      months.push({
        label: new Date(year, m, 1).toLocaleDateString('de-DE', { month: 'short' }),
        runs: runs.length,
        runKm: runs.reduce((a, r) => a + r.distance / 1000, 0),
        workouts: workouts.length,
        pushups,
      });
    }
    const totalRuns = months.reduce((a, m) => a + m.runs, 0);
    const totalKm = months.reduce((a, m) => a + m.runKm, 0);
    const totalWorkouts = months.reduce((a, m) => a + m.workouts, 0);
    const totalPushups = months.reduce((a, m) => a + m.pushups, 0);
    return { year, months, totalRuns, totalKm, totalWorkouts, totalPushups };
  }, [view, state]);

  const trackedExercises = useMemo(() => {
    const map = new Map();
    state.workouts.filter(w => w.done).forEach(w => {
      w.exercises.forEach(ex => {
        if (!map.has(ex.exerciseId)) map.set(ex.exerciseId, ex.name);
      });
    });
    return Array.from(map.entries()).map(([id, name]) => ({ id, name }));
  }, [state.workouts]);

  return (
    <div className="pb-24">
      <div className="pt-6 pb-4">
        <h1 className="text-3xl font-bold text-neutral-100">Statistik</h1>
      </div>

      <div className="bg-neutral-900 rounded-xl p-1 flex gap-1 mb-4">
        {['week', 'month', 'year'].map(v => (
          <button
            key={v}
            onClick={() => setView(v)}
            className={`flex-1 py-2 rounded-lg text-sm font-medium ${view === v ? 'bg-neutral-700 text-neutral-100' : 'text-neutral-500'}`}
          >
            {v === 'week' ? 'Woche' : v === 'month' ? 'Monat' : 'Jahr'}
          </button>
        ))}
      </div>

      {view === 'week' && weekData && (
        <>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <Card>
              <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Aktive Tage</p>
              <p className="text-3xl font-bold text-neutral-100 tabular-nums">{weekData.trainingDays}<span className="text-neutral-600 text-lg"> / 7</span></p>
            </Card>
            <Card>
              <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Workouts</p>
              <p className="text-3xl font-bold text-neutral-100 tabular-nums">{weekData.workouts}</p>
            </Card>
            <Card>
              <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Push-ups</p>
              <p className="text-3xl font-bold text-neutral-100 tabular-nums">{weekData.weekPushups}</p>
            </Card>
            <Card>
              <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Lauf-km</p>
              <p className="text-3xl font-bold text-neutral-100 tabular-nums">{weekData.runKm.toFixed(1)}</p>
            </Card>
            <Card className="col-span-2">
              <p className="text-xs text-neutral-500 uppercase tracking-wider mb-1">Streak</p>
              <p className="text-3xl font-bold text-lime-400 tabular-nums">{streak} Tage</p>
            </Card>
          </div>

          <Card>
            <h2 className="text-lg font-semibold text-neutral-100 mb-4">Tage</h2>
            <div className="space-y-3">
              {weekData.days.map(d => (
                <div key={d.key} className="flex items-center gap-3">
                  <div className="w-12 text-center">
                    <p className={`text-xs uppercase ${d.isToday ? 'text-lime-400' : 'text-neutral-500'}`}>{d.label}</p>
                    <p className={`text-lg font-semibold tabular-nums ${d.isToday ? 'text-lime-400' : 'text-neutral-300'}`}>{d.date}</p>
                  </div>
                  <div className="flex-1">
                    <div className="h-2 bg-neutral-800 rounded-full overflow-hidden">
                      <div className={`h-full ${d.active ? 'bg-lime-400' : 'bg-neutral-700'}`} style={{ width: `${Math.min(100, (d.pushups / 100) * 100)}%` }} />
                    </div>
                    <p className="text-xs text-neutral-500 mt-1 truncate">
                      {[d.runs > 0 && `${d.runKm.toFixed(1)}km`, d.workouts > 0 && `${d.workouts} Workout${d.workouts > 1 ? 's' : ''}`, d.pushups > 0 && `${d.pushups} Push-ups`].filter(Boolean).join(' · ') || '-'}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}

      {view === 'month' && monthData && (
        <>
          <Card className="mb-4">
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">{monthData.monthLabel}</p>
            <div className="grid grid-cols-7 gap-1.5 mb-3 text-center">
              {['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => (
                <span key={d} className="text-xs text-neutral-600">{d}</span>
              ))}
              {monthData.cells.map((c, i) => {
                if (!c) return <span key={i} />;
                const colors = ['bg-neutral-800', 'bg-lime-900', 'bg-lime-700', 'bg-lime-400'];
                return (
                  <div key={i} className={`aspect-square rounded ${colors[c.intensity]} ${c.isToday ? 'ring-2 ring-lime-400' : ''} flex items-center justify-center`}>
                    <span className={`text-xs ${c.intensity >= 2 ? 'text-neutral-900' : 'text-neutral-500'}`}>{c.day}</span>
                  </div>
                );
              })}
            </div>
            <div className="flex items-center justify-end gap-1.5 text-xs text-neutral-600 pt-2">
              <span>weniger</span>
              <div className="w-3 h-3 rounded bg-neutral-800" />
              <div className="w-3 h-3 rounded bg-lime-900" />
              <div className="w-3 h-3 rounded bg-lime-700" />
              <div className="w-3 h-3 rounded bg-lime-400" />
              <span>mehr</span>
            </div>
          </Card>

          <div className="grid grid-cols-2 gap-3">
            <Card><p className="text-xs text-neutral-500 mb-1">Aktive Tage</p><p className="text-3xl font-bold text-neutral-100 tabular-nums">{monthData.activeDays}</p></Card>
            <Card><p className="text-xs text-neutral-500 mb-1">Workouts</p><p className="text-3xl font-bold text-neutral-100 tabular-nums">{monthData.workouts}</p></Card>
            <Card><p className="text-xs text-neutral-500 mb-1">Läufe / km</p><p className="text-2xl font-bold text-neutral-100 tabular-nums">{monthData.runs}<span className="text-neutral-600 text-base"> · {monthData.runKm.toFixed(1)}</span></p></Card>
            <Card><p className="text-xs text-neutral-500 mb-1">Push-ups</p><p className="text-3xl font-bold text-neutral-100 tabular-nums">{monthData.pushups}</p></Card>
          </div>
        </>
      )}

      {view === 'year' && yearData && (
        <>
          <Card className="mb-4">
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">{yearData.year}</p>
            <div className="grid grid-cols-2 gap-3">
              <div><p className="text-xs text-neutral-500">Workouts</p><p className="text-2xl font-bold text-neutral-100">{yearData.totalWorkouts}</p></div>
              <div><p className="text-xs text-neutral-500">Läufe</p><p className="text-2xl font-bold text-neutral-100">{yearData.totalRuns}</p></div>
              <div><p className="text-xs text-neutral-500">Lauf-km</p><p className="text-2xl font-bold text-neutral-100">{yearData.totalKm.toFixed(1)}</p></div>
              <div><p className="text-xs text-neutral-500">Push-ups</p><p className="text-2xl font-bold text-neutral-100">{yearData.totalPushups}</p></div>
            </div>
          </Card>

          <Card className="mb-4">
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Workouts pro Monat</p>
            <ResponsiveContainer width="100%" height={160}>
              <BarChart data={yearData.months}>
                <CartesianGrid strokeDasharray="3 3" stroke="#262626" vertical={false} />
                <XAxis dataKey="label" tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} width={20} />
                <Tooltip contentStyle={{ background: '#171717', border: '1px solid #262626', borderRadius: 8, fontSize: 12 }} />
                <Bar dataKey="workouts" fill="#a3e635" radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </Card>

          <Card className="mb-4">
            <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Lauf-km pro Monat</p>
            <ResponsiveContainer width="100%" height={160}>
              <BarChart data={yearData.months}>
                <CartesianGrid strokeDasharray="3 3" stroke="#262626" vertical={false} />
                <XAxis dataKey="label" tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} width={20} />
                <Tooltip contentStyle={{ background: '#171717', border: '1px solid #262626', borderRadius: 8, fontSize: 12 }} />
                <Bar dataKey="runKm" fill="#fb923c" radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </Card>
        </>
      )}

      {state.runs.length > 0 && (
        <Card className="mt-4">
          <h2 className="text-lg font-semibold text-neutral-100 mb-3 flex items-center gap-2">
            <MapPin size={18} /> Läufe
          </h2>
          <div className="space-y-1">
            {[...state.runs].sort((a, b) => b.startedAt - a.startedAt).slice(0, 20).map(r => (
              <button
                key={r.id}
                onClick={() => onShowRun(r.id)}
                className="w-full text-left bg-neutral-800 hover:bg-neutral-700 rounded-lg px-3 py-2.5 flex items-center justify-between"
              >
                <div>
                  <p className="text-sm text-neutral-200">{(r.distance / 1000).toFixed(2)} km · {formatDuration(r.duration)}</p>
                  <p className="text-xs text-neutral-500">{formatDateShort(r.date)}</p>
                </div>
                <ChevronLeft size={16} className="text-neutral-500 rotate-180" />
              </button>
            ))}
          </div>
        </Card>
      )}

      {trackedExercises.length > 0 && (
        <Card className="mt-4">
          <h2 className="text-lg font-semibold text-neutral-100 mb-3 flex items-center gap-2">
            <BarChart3 size={18} /> Fortschritt pro Übung
          </h2>
          <div className="space-y-1">
            {trackedExercises.map(ex => (
              <button
                key={ex.id}
                onClick={() => onShowProgression(ex.id)}
                className="w-full text-left bg-neutral-800 hover:bg-neutral-700 rounded-lg px-3 py-2.5 text-sm text-neutral-200 flex items-center justify-between"
              >
                <span>{ex.name}</span>
                <ChevronLeft size={16} className="text-neutral-500 rotate-180" />
              </button>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

// ---------- Exercise Progression ----------
const Progression = ({ state, exerciseId, onBack }) => {
  const data = useMemo(() => {
    const points = [];
    state.workouts.filter(w => w.done).forEach(w => {
      const log = w.exercises.find(e => e.exerciseId === exerciseId);
      if (!log) return;
      const numericReps = log.sets.map(s => parseInt(s.reps, 10)).filter(n => !isNaN(n));
      const weights = log.sets.map(s => parseFloat(s.weight)).filter(n => !isNaN(n));
      const volumes = log.sets.map(s => {
        const r = parseInt(s.reps, 10) || 0;
        const wt = parseFloat(s.weight) || 0;
        return wt > 0 ? r * wt : r;
      });
      points.push({
        date: w.date,
        label: formatDateShort(w.date),
        maxReps: numericReps.length ? Math.max(...numericReps) : 0,
        maxWeight: weights.length ? Math.max(...weights) : 0,
        volume: volumes.reduce((a, b) => a + b, 0),
        avgRpe: log.sets.length ? log.sets.reduce((a, s) => a + (s.rpe || 0), 0) / log.sets.length : 0,
      });
    });
    return points.sort((a, b) => a.date.localeCompare(b.date));
  }, [state, exerciseId]);

  const name = data.length > 0
    ? state.workouts.flatMap(w => w.exercises).find(e => e.exerciseId === exerciseId)?.name
    : exerciseId;

  const hasWeight = data.some(d => d.maxWeight > 0);

  if (data.length === 0) {
    return (
      <div className="pb-24">
        <div className="flex items-center gap-3 pt-6 pb-4">
          <button onClick={onBack} className="text-neutral-400"><ChevronLeft size={24} /></button>
          <h1 className="text-2xl font-bold text-neutral-100">{name}</h1>
        </div>
        <p className="text-neutral-500 text-center py-12">Noch keine Daten.</p>
      </div>
    );
  }

  const latest = data[data.length - 1];
  const first = data[0];

  return (
    <div className="pb-24">
      <div className="flex items-center gap-3 pt-6 pb-4">
        <button onClick={onBack} className="text-neutral-400"><ChevronLeft size={24} /></button>
        <h1 className="text-2xl font-bold text-neutral-100">{name}</h1>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <p className="text-xs text-neutral-500 mb-1">Max Wdh</p>
          <p className="text-3xl font-bold text-neutral-100 tabular-nums">{Math.max(...data.map(d => d.maxReps))}</p>
        </Card>
        {hasWeight && (
          <Card>
            <p className="text-xs text-neutral-500 mb-1">Max Gewicht</p>
            <p className="text-3xl font-bold text-neutral-100 tabular-nums">{Math.max(...data.map(d => d.maxWeight))}<span className="text-neutral-600 text-lg"> kg</span></p>
          </Card>
        )}
        <Card className={hasWeight ? '' : 'col-span-2'}>
          <p className="text-xs text-neutral-500 mb-1">Sessions</p>
          <p className="text-3xl font-bold text-neutral-100 tabular-nums">{data.length}</p>
        </Card>
      </div>

      <Card className="mb-3">
        <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Max Wdh über Zeit</p>
        <ResponsiveContainer width="100%" height={180}>
          <LineChart data={data}>
            <CartesianGrid strokeDasharray="3 3" stroke="#262626" vertical={false} />
            <XAxis dataKey="label" tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} width={28} />
            <Tooltip contentStyle={{ background: '#171717', border: '1px solid #262626', borderRadius: 8, fontSize: 12 }} />
            <Line type="monotone" dataKey="maxReps" stroke="#a3e635" strokeWidth={2.5} dot={{ fill: '#a3e635', r: 4 }} />
          </LineChart>
        </ResponsiveContainer>
      </Card>

      {hasWeight && (
        <Card className="mb-3">
          <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Max Gewicht (kg)</p>
          <ResponsiveContainer width="100%" height={180}>
            <LineChart data={data}>
              <CartesianGrid strokeDasharray="3 3" stroke="#262626" vertical={false} />
              <XAxis dataKey="label" tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} width={28} />
              <Tooltip contentStyle={{ background: '#171717', border: '1px solid #262626', borderRadius: 8, fontSize: 12 }} />
              <Line type="monotone" dataKey="maxWeight" stroke="#fb923c" strokeWidth={2.5} dot={{ fill: '#fb923c', r: 4 }} />
            </LineChart>
          </ResponsiveContainer>
        </Card>
      )}

      <Card>
        <p className="text-xs text-neutral-500 uppercase tracking-wider mb-3">Volumen (Wdh × kg)</p>
        <ResponsiveContainer width="100%" height={180}>
          <BarChart data={data}>
            <CartesianGrid strokeDasharray="3 3" stroke="#262626" vertical={false} />
            <XAxis dataKey="label" tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fill: '#737373', fontSize: 11 }} axisLine={false} tickLine={false} width={28} />
            <Tooltip contentStyle={{ background: '#171717', border: '1px solid #262626', borderRadius: 8, fontSize: 12 }} />
            <Bar dataKey="volume" fill="#a3e635" radius={[4, 4, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </Card>

      <p className="text-center text-neutral-600 text-xs mt-4">
        Von {first.maxReps} Wdh am {formatDateShort(first.date)} auf {latest.maxReps} am {formatDateShort(latest.date)}.
      </p>
    </div>
  );
};

// ---------- Check-in (unchanged) ----------
const CheckIn = ({ state, setState }) => {
  const weekStart = getWeekStart();
  const existing = state.checkIns.find(c => c.weekStart === weekStart);
  const [draft, setDraft] = useState(existing || {
    weekStart, weight: '', waist: '', photoData: null,
    energy: 7, sleep: 7, motivation: 7, note: '',
  });
  const [showHistory, setShowHistory] = useState(false);

  const save = () => {
    const checkIns = existing
      ? state.checkIns.map(c => c.weekStart === weekStart ? draft : c)
      : [...state.checkIns, draft];
    setState({ ...state, checkIns });
  };

  const handlePhoto = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setDraft({ ...draft, photoData: ev.target.result });
    reader.readAsDataURL(file);
  };

  if (showHistory) {
    const sorted = [...state.checkIns].sort((a, b) => b.weekStart.localeCompare(a.weekStart));
    return (
      <div className="pb-24">
        <div className="flex items-center gap-3 pt-6 pb-4">

          <h1 className="text-2xl font-bold text-neutral-100">Verlauf</h1>
        </div>
        {sorted.length === 0 && <p className="text-neutral-500 text-center py-12">Noch keine Einträge.</p>}

          {sorted.map(c => (

                {c.weight && <div><p className="text-neutral-500 text-xs">Gewicht</p><p className="text-neutral-100">{c.weight} kg</p></div>}

                <div><p className="text-neutral-500 text-xs">Energie</p><p className="text-neutral-100">{c.energy}/10</p></div>
                <div><p className="text-neutral-500 text-xs">Schlaf</p><p className="text-neutral-100">{c.sleep}/10</p></div>
                <div><p className="text-neutral-500 text-xs">Motivation</p><p className="text-neutral-100">{c.motivation}/10</p></div>
              </div>
              {c.note && <p className="text-sm text-neutral-400 mt-2 italic">{c.note}</p>}
              {c.photoData && <img src={c.photoData} alt="" className="mt-3 rounded-lg max-h-48 w-auto" />}
            </Card>
          ))}

    );

    <div className="pb-24">
      <div className="flex justify-between items-start pt-6 pb-4">
        <div>
          <h1 className="text-3xl font-bold text-neutral-100">Check-in</h1>
          <p className="text-sm text-neutral-500 mt-1">Woche ab {formatDateShort(weekStart)}</p>
        </div>
        <Button variant="ghost" onClick={() => setShowHistory(true)} className="text-sm">Verlauf</Button>
      </div>

      <div className="space-y-4">
        <Card>
          <h3 className="text-sm uppercase tracking-wider text-neutral-500 mb-3">Körper (optional)</h3>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-neutral-500">Gewicht (kg)</label>
              <Input value={draft.weight} onChange={(v) => setDraft({ ...draft, weight: v })} type="text" inputMode="decimal" />
            </div>
            <div>
              <label className="text-xs text-neutral-500">Bauchumfang (cm)</label>
              <Input value={draft.waist} onChange={(v) => setDraft({ ...draft, waist: v })} type="text" inputMode="decimal" />
            </div>
          </div>
        </Card>

        <Card>

// ---------- Strava Export Helpers ----------
const downloadFile = (content, filename, mime) => {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
};

const generateRunGPX = (run) => {
  if (!run.points || run.points.length === 0) return null;
  const startISO = new Date(run.startedAt).toISOString();
  const trkpts = run.points.map((p, i) => {
    const t = new Date(run.startedAt + (i / Math.max(1, run.points.length - 1)) * run.duration * 1000).toISOString();
    return `      <trkpt lat="${p.lat}" lon="${p.lon}"><time>${t}</time></trkpt>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Konsistenz" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><time>${startISO}</time></metadata>
  <trk>
    <name>Lauf ${formatDateShort(run.date)}</name>
    <type>Run</type>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
};

const exportRunGPX = (run) => {
  const gpx = generateRunGPX(run);
  if (!gpx) {
    alert('Keine GPS-Punkte vorhanden.');
    return;
  }
  downloadFile(gpx, `lauf_${run.date}.gpx`, 'application/gpx+xml');
};

const exportWorkoutToStrava = (workout, template) => {
  // Krafttraining hat kein GPS, also bauen wir einen Text zum Kopieren + öffnen die Strava-Upload-Seite
  const km = 0;
  const duration = workout.duration || 0;
  const lines = workout.exercises.map(ex => {
    const sets = ex.sets.map(s => {
      const r = s.reps || '?';
      const w = s.weight ? `${s.weight}kg` : '';
      const rpe = s.rpe ? `RPE${s.rpe}` : '';
      return [r + 'x', w, rpe].filter(Boolean).join(' ');
    }).join(', ');
    return `${ex.name}: ${sets}`;
  });
  const desc = `${template?.name || 'Workout'} · ${formatDuration(duration)}\n\n${lines.join('\n')}`;

  // In Zwischenablage kopieren
  if (navigator.clipboard) {
    navigator.clipboard.writeText(desc).then(() => {
      alert('Beschreibung in Zwischenablage kopiert.\n\nStrava öffnet jetzt → Aktivität hinzufügen → manuell → Beschreibung einfügen.');
      window.open('https://www.strava.com/upload/manual', '_blank');
    }).catch(() => {
      // Fallback: download als txt
      downloadFile(desc, `workout_${workout.date}.txt`, 'text/plain');
      window.open('https://www.strava.com/upload/manual', '_blank');
    });
  } else {
    downloadFile(desc, `workout_${workout.date}.txt`, 'text/plain');
    window.open('https://www.strava.com/upload/manual', '_blank');
  }
};

// ---------- Story Hook ----------
const useStory = (state) => {
  const [story, setStory] = useState(initialStory);
  const [apiKey, setApiKeyState] = useState(() => {
    try { return localStorage.getItem(APIKEY_KEY) || ''; } catch (e) { return ''; }
  });
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => { saveStory(story); }, [story]);

  const setApiKey = (key) => {
    setApiKeyState(key);
    try { localStorage.setItem(APIKEY_KEY, key); } catch (e) {}
  };

  // Roll-up: alte Tage zu Tageszusammenfassungen, alte Wochen zu Wochen, etc.
  const rollUp = async (currentStory) => {
    let s = JSON.parse(JSON.stringify(currentStory));
    const today = todayKey();
    let changed = false;

    // 1. Vergangene Tage mit Beats, aber ohne daily summary -> zusammenfassen
    const pastDates = [...new Set(s.beats.filter(b => b.date !== today).map(b => b.date))];
    for (const date of pastDates) {
      if (!s.summaries.daily[date]) {
        const dayBeats = s.beats.filter(b => b.date === date).map(b => b.text).join('\n\n');
        try {
          s.summaries.daily[date] = await summarizeDay(apiKey, dayBeats);
          changed = true;
        } catch (e) { /* still continue */ }
      }
    }

    // 2. Beats von vergangenen Tagen entfernen, sobald daily summary existiert (spart Speicher)
    const beforeCount = s.beats.length;
    s.beats = s.beats.filter(b => b.date === today || !s.summaries.daily[b.date]);
    if (s.beats.length !== beforeCount) changed = true;

    // 3. Wochen, die komplett vorbei sind und tägliche Summaries haben -> Wochen-Summary
    const currentWeek = getWeekStart();
    const dailyByWeek = {};
    Object.keys(s.summaries.daily).forEach(d => {
      const wk = getWeekStart(parseKey(d));
      if (wk !== currentWeek) {
        if (!dailyByWeek[wk]) dailyByWeek[wk] = [];
        dailyByWeek[wk].push(d);
      }
    });
    for (const wk of Object.keys(dailyByWeek)) {
      if (!s.summaries.weekly[wk]) {
        const text = dailyByWeek[wk].sort().map(d => s.summaries.daily[d]).join(' ');
        try {
          s.summaries.weekly[wk] = await summarizePeriod(apiKey, text, 'Wochen');
          changed = true;
          // tägliche Summaries dieser Woche entfernen
          dailyByWeek[wk].forEach(d => delete s.summaries.daily[d]);
        } catch (e) {}
      }
    }

    // 4. Monate aus Wochen verdichten
    const currentMonth = today.slice(0, 7);
    const weeklyByMonth = {};
    Object.keys(s.summaries.weekly).forEach(wk => {
      const month = wk.slice(0, 7);
      if (month !== currentMonth) {
        if (!weeklyByMonth[month]) weeklyByMonth[month] = [];
        weeklyByMonth[month].push(wk);
      }
    });
    for (const month of Object.keys(weeklyByMonth)) {
      // nur verdichten wenn der Monat wirklich vorbei ist (mind. 4 Wochen-Summaries oder neuer Monat)
      if (weeklyByMonth[month].length >= 3 && !s.summaries.monthly[month]) {
        const text = weeklyByMonth[month].sort().map(wk => s.summaries.weekly[wk]).join(' ');
        try {
          s.summaries.monthly[month] = await summarizePeriod(apiKey, text, 'Monats');
          changed = true;
          weeklyByMonth[month].forEach(wk => delete s.summaries.weekly[wk]);
        } catch (e) {}
      }
    }

    return changed ? s : null;
  };

  const addBeat = async (trigger, triggerDetail) => {
    if (!apiKey) { setError('Kein API-Key hinterlegt. Unter Einstellungen eintragen.'); return; }
    if (generating) return; // Parallele Generierung vermeiden
    setGenerating(true);
    setError(null);
    try {
      // Erst Roll-up falls nötig (z.B. neuer Tag)
      const rolled = await rollUp(story);
      const working = rolled || story;

      const result = await generateBeat(apiKey, working, state, trigger, triggerDetail);
      const beat = { id: `b_${Date.now()}`, date: todayKey(), ts: Date.now(), text: result.text, trigger };

      // Funktionales Update: setzt auf dem jeweils aktuellsten Story-Stand auf,
      // inkl. der Roll-up-Änderungen aus 'working'
      setStory(prev => {
        const base = rolled || prev;
        const updated = { ...base, beats: [...base.beats, beat] };
        if (!updated.meta.started) updated.meta.started = todayKey();
        if (result.genre) updated.meta = { ...updated.meta, genre: result.genre };
        if (result.character) updated.meta = { ...updated.meta, character: result.character };
        if (trigger === 'open') updated.lastOpenDate = todayKey();
        return updated;
      });
    } catch (e) {
      setError(e.message);
    } finally {
      setGenerating(false);
    }
  };

  // Tägliche Eröffnung: einmal pro Tag beim App-Start, ohne Aktivität
  const maybeOpenDay = async () => {
    if (!apiKey) return;
    const today = todayKey();
    if (story.lastOpenDate === today) return; // heute schon eröffnet
    await addBeat('open', null);
  };

  const resetStory = () => {
    if (window.confirm('Geschichte komplett neu starten? Alle bisherigen Kapitel gehen verloren.')) {
      const fresh = initialStory();
      fresh.beats = [];
      fresh.summaries = { daily: {}, weekly: {}, monthly: {} };
      fresh.meta = { genre: null, character: null, arc: null, started: null };
      fresh.lastOpenDate = null;
      setStory(fresh);
    }
  };

  const setCharacter = (character) => {
    setStory(s => ({ ...s, meta: { ...s.meta, character } }));
  };

  return { story, apiKey, setApiKey, generating, error, addBeat, maybeOpenDay, resetStory, setCharacter };
};

// ---------- Root ----------
function App() {
  const [state, setState] = useState(initialState);
  const [tab, setTab] = useState('home');
  const [activeWorkout, setActiveWorkout] = useState(null);
  const [activeRun, setActiveRun] = useState(false);
  const [viewRunId, setViewRunId] = useState(null);
  const [progressionExId, setProgressionExId] = useState(null);
  const [showStoryFull, setShowStoryFull] = useState(false);

  const storyApi = useStory(state);

  useEffect(() => { saveState(state); }, [state]);

  // Tägliche Eröffnungsszene beim ersten App-Start des Tages
  useEffect(() => {
    if (storyApi.apiKey) {
      storyApi.maybeOpenDay();
    }
    // eslint-disable-next-line
  }, [storyApi.apiKey]);

  const viewedRun = viewRunId ? state.runs.find(r => r.id === viewRunId) : null;

  const handleExportWorkout = (workout) => {
    const template = state.templates.find(t => t.id === workout.templateId);
    exportWorkoutToStrava(workout, template);
  };

  const handleDeleteRun = (runId) => {
    setState({ ...state, runs: state.runs.filter(r => r.id !== runId) });
    setViewRunId(null);
  };

  // Wird nach einem gespeicherten Lauf aufgerufen
  const handleRunSaved = (run) => {
    const km = (run.distance / 1000).toFixed(2);
    storyApi.addBeat('run', `${km} km in ${formatDuration(run.duration)}`);
  };

  return (
    <div className="min-h-screen bg-neutral-950 text-neutral-100" style={{ fontFamily: "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" }}>
      <div className="max-w-md mx-auto px-4">
        {showStoryFull ? (
          <StoryFull story={storyApi.story} onBack={() => setShowStoryFull(false)} />
        ) : activeRun ? (
          <RunTracker state={state} setState={setState} onBack={() => setActiveRun(false)} onRunSaved={handleRunSaved} />
        ) : viewedRun ? (
          <RunDetail run={viewedRun} onBack={() => setViewRunId(null)} onDelete={handleDeleteRun} onExport={exportRunGPX} />
        ) : progressionExId ? (
          <Progression state={state} exerciseId={progressionExId} onBack={() => setProgressionExId(null)} />
        ) : activeWorkout ? (
          <WorkoutSession
            state={state} setState={setState} templateId={activeWorkout}
            onBack={() => setActiveWorkout(null)} onExportWorkout={handleExportWorkout}
          />
        ) : (
          <>
            {tab === 'home' && (
              <Dashboard
                state={state} setState={setState}
                onStartWorkout={setActiveWorkout}
                onStartRun={() => setActiveRun(true)}
                onShowRun={setViewRunId}
                storyApi={storyApi}
                onOpenStoryFull={() => setShowStoryFull(true)}
              />
            )}
            {tab === 'plan' && <Plan state={state} setState={setState} />}
            {tab === 'stats' && <Stats state={state} onShowProgression={setProgressionExId} onShowRun={setViewRunId} />}
            {tab === 'checkin' && <CheckIn state={state} setState={setState} />}
            {tab === 'settings' && <SettingsView state={state} setState={setState} storyApi={storyApi} />}
          </>
        )}
      </div>
      {!activeWorkout && !activeRun && !viewedRun && !progressionExId && !showStoryFull && <Nav tab={tab} setTab={setTab} />}
    </div>
  );
}


    // Render
    document.getElementById('loading').remove();
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
